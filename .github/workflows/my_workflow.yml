name: Test Workflow

on: push

jobs:
  dump_contexts:
    runs-on: ubuntu-latest
    env:
      GITHUB_CTX: $${{ toJson(github) }}
    steps:
      - name: github
        run: echo "$GITHUB_CTX"
      - name: job
        env:
          JOB_CTX: $${{ toJson(job) }}
        run: echo "$JOB_CTX"
      - name: steps
        env:
          STEPS_CTX: $${{ toJson(steps) }}
        run: echo "$STEPS_CTX"
      - name: runner
        env:
          RUNNER_CTX: $${{ toJson(runner) }}
        run: echo "$RUNNER_CTX"
      - name: strategy
        env:
          STRATEGY_CTX: $${{ toJson(strategy) }}
        run: echo "$STRATEGY_CTX"
      - name: matrix
        env:
          MATRIX_CTX: $${{ toJson(matrix) }}
        run: echo "$MATRIX_CTX"

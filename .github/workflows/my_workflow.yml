name: Test Workflow

on: push

jobs:
  print_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print env
        run: echo '${{ toJson(env) }}'
      - name: Print vars
        run: echo '${{ toJson(vars) }}'
      - name: Print github
        run: echo '${{ toJson(github) }}'
      - name: Print runner
        run: echo '${{ toJson(runner) }}'
